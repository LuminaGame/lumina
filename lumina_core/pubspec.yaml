name: lumina_core
description: "The pure-Dart foundation Lumina's engine, editor and plugin processes share: math (units, axes, Euler), the file formats (.lmas, .lmproject, levels, .lmplugin) and their repositories, the engine logger, workspace and data paths, and pure tooling services. No Flutter, dart:ui or FFI."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
resolution: workspace

# Pure packages only: no flutter, ffi or image, and nothing that depends on
# them (test/architecture/pure_dart_test.dart walks the whole import graph).
dependencies:
  crypto: ^3.0.7
  meta: ^1.15.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  vector_math: ^2.1.4
  yaml: ^3.1.3

dev_dependencies:
  # Parses directives for the pure-Dart guard (pure Dart itself).
  analyzer: ^13.3.0
  archive: ^4.2.0
  # Decodes the PNGs the TGA decoder writes (tests only; pure Dart).
  image: ^4.9.2
  lints: ^6.0.0
  test: ^1.31.1
