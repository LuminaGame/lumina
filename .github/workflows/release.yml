# Release: builds prebuilt Lumina Studio (lumina_ui) for Windows and Linux,
# the prebuilt OpenRigLogic archive the installed editor downloads at first
# launch, and the native installers, then publishes all of them as the GitHub
# release of the tag.
#
#   check ──┬── filament (windows, linux, linux-arm64) ──┬── filament-release ──┐
#           │                                           └── studio (same three) ─┤
#           ├── web (flutter_filament WebAssembly module) ─────────────────┤
#           └── installers (setup.exe; .deb + .rpm) ───────────────────────┴── release
#
# The web job builds flutter_filament's WebAssembly module
# (.github/actions/filament-web: patched Filament source, host tools, emsdk)
# and the release carries it as flutter-filament-web-<tag>.zip, the files a
# web game serves next to its index.html and the editor stages into web
# builds.
#
# Prebuilt Filament is published once per tool/filament/VERSION, in its own
# release `filament-<VERSION>` (a pre-release that is never "Latest", created
# at the commit that built it; .github/scripts/filament_release.sh). Each
# `filament` leg first asks whether that release already has its OS's
# archive and sidecar: if so it does nothing, otherwise it restores the
# archive from the cache (or builds it) and hands it on as an artifact. The
# single `filament-release` job then creates the release if needed and
# uploads only what is missing; a complete Filament release is never
# changed, and its job-level concurrency group keeps runs of two tags from
# writing to it at once. The Lumina release carries no Filament: its notes
# link the Filament release, and the editor downloads from there (falling
# back to its own tag, which is where releases up to v0.0.1-dev.6 put it).
#
# The Flutter SDK is pinned in FLUTTER_VERSION below: the version the
# workspace is developed and tested with (the pubspecs only constrain the Dart
# SDK, ^3.12.0, and the lock file records flutter >=3.47.0). Keep ci.yml in
# step when bumping it.
#
# Sibling repos: tools, plugins and marketplace are checked out next to this
# repository at the commit SHAs the pubspecs pin, and pubspec_overrides.yaml
# points the git dependencies at them (.github/actions/checkout-siblings), the
# layout of a local development checkout. Letting pub resolve the git
# dependencies instead does not work here: the plugins depend on `lumina` and
# `lumina_editor_api` from git, which conflicts with the workspace's own path
# packages, and flutter_riglogic's hook needs the OpenRigLogic library built
# inside its package folder, which a pub-cache copy does not have.
#
# Every release carries an unsigned Microsoft Store package of the editor,
# lumina-studio-<tag>-windows-x64-store.msix (tool/package_windows.dart
# --store, the Partner Center identity from lumina_ui/pubspec.yaml
# msix_config), to upload in Partner Center; the Store signs it. Its version
# is the check job's msix_version (tool/release/release_info.dart), which
# the Store accepts and which grows with every tag.
#
# Secrets (all optional; without them the signed MSIX is skipped with a notice):
#   LUMINA_MSIX_PUBLISHER       certificate subject, equal to the package publisher
#   LUMINA_MSIX_CERT_BASE64     the code-signing .pfx, base64-encoded
#   LUMINA_MSIX_CERT_PASSWORD   its password
# Variables (optional):
#   LUMINA_MSIX_TIMESTAMP_URL   RFC 3161 timestamp server for the MSIX
#   LUMINA_WINDOWS_SIGNING      `local`: the Windows zip and setup are
#                               Authenticode-signed on the maintainer's machine
#                               (tool/release/sign_windows_release.ps1, with a
#                               certificate CI cannot reach), so the release is
#                               created as a draft whose notes say the Windows
#                               assets are being signed; the script publishes
#                               it. Unset: the release is published right away.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Check pins and version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      msix_version: ${{ steps.version.outputs.msix_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      filament_version: ${{ steps.filament.outputs.version }}
      filament_tag: ${{ steps.filament.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$tag\" is not a release tag (v<major>.<minor>.<patch>[-<prerelease>])."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: lumina
          persist-credentials: false

      - name: Commit
        id: sha
        run: echo "sha=$(git -C lumina rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Filament version
        id: filament
        run: |
          version="$(tr -d '[:space:]' < lumina/tool/filament/VERSION)"
          if [ -z "$version" ]; then
            echo "::error::tool/filament/VERSION is empty."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=filament-$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Tag matches lumina_ui version
        id: version
        run: dart lumina/tool/release/release_info.dart version --tag "${{ steps.tag.outputs.tag }}" --github-output

      - uses: ./lumina/.github/actions/checkout-siblings

      - name: Resolve the workspace
        working-directory: lumina
        run: flutter pub get

      - name: Cross-repo pins
        working-directory: lumina
        run: dart run tool/pin_deps.dart --check

  filament:
    name: Filament (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            # VS 2022 (MSVC 14.44): static libraries built with a newer MSVC
            # do not link with an older one, and users run VS 2022 Build Tools.
            runner: windows-2022
            os: windows
            arch: x64
          # The bundled libc++ needs glibc 2.38+, so Linux builds run on 24.04.
          - platform: linux
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FILAMENT_TAG: ${{ needs.check.outputs.filament_tag }}
      FILAMENT_VERSION: ${{ needs.check.outputs.filament_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: lumina
          persist-credentials: false

      # When the Filament release already has this OS's archive and sidecar,
      # nothing is restored, built or uploaded. A failed lookup builds, and
      # filament-release decides what is really missing.
      - name: Already in the Filament release?
        id: published
        shell: bash
        run: |
          if ! missing="$(bash lumina/.github/scripts/filament_release.sh missing "$FILAMENT_TAG" "$FILAMENT_VERSION" "${{ matrix.platform }}")"; then
            echo "::warning::Could not read the release $FILAMENT_TAG; making Filament $FILAMENT_VERSION available anyway."
            missing=unknown
          fi
          if [ -z "$missing" ]; then
            echo "::notice::$FILAMENT_TAG already has Filament $FILAMENT_VERSION for ${{ matrix.platform }}; nothing to build or upload."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: matrix.os == 'linux' && steps.published.outputs.published != 'true'
        uses: ./lumina/.github/actions/linux-build-deps

      - id: filament
        if: steps.published.outputs.published != 'true'
        uses: ./lumina/.github/actions/filament-prebuilt
        with:
          fetch: 'false'
          save: 'true'

      - if: steps.published.outputs.published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: filament-${{ matrix.platform }}
          path: lumina/build/filament-prebuilt/filament-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The only job that writes the Filament release. Queued per Filament
  # version across workflow runs, so two tags never create it or upload to it
  # at the same time; `publish` also tolerates a release another run created
  # first and never replaces a complete archive/sidecar pair.
  filament-release:
    name: Filament release
    needs: [check, filament]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: filament-release-${{ needs.check.outputs.filament_version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FILAMENT_TAG: ${{ needs.check.outputs.filament_tag }}
      FILAMENT_VERSION: ${{ needs.check.outputs.filament_version }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: lumina
          persist-credentials: false

      - name: What is missing?
        id: missing
        run: |
          set -euo pipefail
          missing="$(bash lumina/.github/scripts/filament_release.sh missing "$FILAMENT_TAG" "$FILAMENT_VERSION")"
          if [ -z "$missing" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            printf 'Missing from %s:\n%s\n' "$FILAMENT_TAG" "$missing"
          fi

      - name: Download the Filament builds
        if: steps.missing.outputs.complete != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: filament-*
          path: filament
          merge-multiple: true

      - name: Create or complete the Filament release
        if: steps.missing.outputs.complete != 'true'
        run: bash lumina/.github/scripts/filament_release.sh publish "$FILAMENT_TAG" "$FILAMENT_VERSION" "$SHA" filament

      - name: Summary
        run: |
          {
            echo "### Filament $FILAMENT_VERSION"
            echo
            if [ "${{ steps.missing.outputs.complete }}" = true ]; then
              echo "[$FILAMENT_TAG](https://github.com/$GH_REPO/releases/tag/$FILAMENT_TAG) was already complete; nothing uploaded."
            else
              echo "[$FILAMENT_TAG](https://github.com/$GH_REPO/releases/tag/$FILAMENT_TAG) created or completed from this run's builds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  studio:
    name: Lumina Studio (${{ matrix.platform }})
    needs: [check, filament]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            # VS 2022 (MSVC 14.44): static libraries built with a newer MSVC
            # do not link with an older one, and users run VS 2022 Build Tools.
            runner: windows-2022
            os: windows
            arch: x64
          - platform: linux
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
      HAS_MSIX_CERT: ${{ secrets.LUMINA_MSIX_CERT_BASE64 != '' && secrets.LUMINA_MSIX_PUBLISHER != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: lumina
          persist-credentials: false

      - if: matrix.os == 'linux'
        uses: ./lumina/.github/actions/linux-build-deps

      - if: matrix.arch != 'arm64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter publishes no Linux arm64 SDK archive, so the action cannot
      # resolve one; the SDK is cloned at the pinned version instead and
      # bootstraps its own arm64 Dart on first use.
      - if: matrix.arch == 'arm64'
        name: Flutter from git (Linux arm64)
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics --enable-linux-desktop

      - uses: ./lumina/.github/actions/checkout-siblings

      - name: Resolve the workspace
        working-directory: lumina
        run: flutter pub get

      # Filament for the hooks: the archive this run's filament job built
      # (there is none when the Filament release already had it), else the
      # cache, else the filament-<VERSION> release, unpacked into the folder
      # the root pubspec's `filament_dir` user-defines name.
      - name: Filament built by this run
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: filament-${{ matrix.platform }}
          path: lumina/build/filament-prebuilt

      - uses: ./lumina/.github/actions/filament-prebuilt
        with:
          fetch: 'true'
          save: 'false'
          extract: 'true'

      - name: Build OpenRigLogic (Linux)
        if: matrix.os == 'linux'
        run: bash tools/flutter_riglogic/tool/build_openriglogic.sh

      - name: Build OpenRigLogic (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: call tools\flutter_riglogic\tool\build_openriglogic.bat

      # The library an installed editor links into its engine checkout as
      # `openriglogic/` (the root pubspec's riglogic_lib_dir): the
      # flutter_riglogic it resolves from git has none built.
      - name: Package OpenRigLogic
        run: bash lumina/.github/scripts/package_openriglogic.sh ${{ matrix.platform }} tools/flutter_riglogic dist

      - name: flutter build ${{ matrix.os }}
        working-directory: lumina/lumina_ui
        run: >-
          flutter build ${{ matrix.os }} --release
          --dart-define=LUMINA_VERSION=${{ env.TAG }}
          --dart-define=LUMINA_COMMIT=${{ env.SHA }}

      - name: Package
        working-directory: lumina/lumina_ui
        run: bash ../.github/scripts/package_studio.sh ${{ matrix.platform }} "$TAG" ../../dist

      # The MSIX of the editor itself, signed with the certificate from the
      # secrets (tool/package_windows.dart --publish, identity from
      # lumina_ui/pubspec.yaml msix_config). Built here because the packaging
      # tool needs the resolved workspace and the Release folder above.
      - name: MSIX (signed)
        if: matrix.platform == 'windows' && env.HAS_MSIX_CERT == 'true'
        working-directory: lumina/lumina_ui
        shell: pwsh
        env:
          LUMINA_MSIX_PUBLISHER: ${{ secrets.LUMINA_MSIX_PUBLISHER }}
          LUMINA_MSIX_CERT_PASSWORD: ${{ secrets.LUMINA_MSIX_CERT_PASSWORD }}
          LUMINA_MSIX_CERT_BASE64: ${{ secrets.LUMINA_MSIX_CERT_BASE64 }}
          LUMINA_MSIX_TIMESTAMP_URL: ${{ vars.LUMINA_MSIX_TIMESTAMP_URL }}
          MSIX_VERSION: ${{ needs.check.outputs.msix_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'lumina-msix.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUMINA_MSIX_CERT_BASE64))
          $env:LUMINA_MSIX_CERT_BASE64 = ''
          $env:LUMINA_MSIX_CERT_PATH = $pfx
          if (-not $env:LUMINA_MSIX_TIMESTAMP_URL) { Remove-Item Env:LUMINA_MSIX_TIMESTAMP_URL -ErrorAction SilentlyContinue }
          try {
            dart run tool/package_windows.dart --publish --skip-build --version $env:MSIX_VERSION --output build/msix
            if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed (exit $LASTEXITCODE)" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
          $msix = Get-ChildItem build/msix -Filter *.msix | Select-Object -First 1
          $name = "lumina-studio-$env:TAG-windows-x64.msix"
          $dest = Join-Path (Resolve-Path ../../dist) $name
          Copy-Item $msix.FullName $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$dest.sha256", "$hash  $name`n")

      - name: MSIX skipped
        if: matrix.platform == 'windows' && env.HAS_MSIX_CERT != 'true'
        run: echo "::notice::No MSIX signing secrets (LUMINA_MSIX_PUBLISHER, LUMINA_MSIX_CERT_BASE64); the signed MSIX is not part of this release."

      # The Microsoft Store package: unsigned (the Store signs it), with the
      # Partner Center identity and publisher from msix_config, over the same
      # Release folder. No secrets needed, so every release has one.
      - name: MSIX (Microsoft Store)
        if: matrix.platform == 'windows'
        working-directory: lumina/lumina_ui
        shell: pwsh
        env:
          MSIX_VERSION: ${{ needs.check.outputs.msix_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dart run tool/package_windows.dart --store --skip-build --version $env:MSIX_VERSION --output build/msix-store
          if ($LASTEXITCODE -ne 0) { throw "Store MSIX packaging failed (exit $LASTEXITCODE)" }
          $msix = Get-ChildItem build/msix-store -Filter *.msix | Select-Object -First 1
          $name = "lumina-studio-$env:TAG-windows-x64-store.msix"
          $dest = Join-Path (Resolve-Path ../../dist) $name
          Copy-Item $msix.FullName $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$dest.sha256", "$hash  $name`n")

      - uses: actions/upload-artifact@v7
        with:
          name: studio-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  web:
    name: flutter_filament web module
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: lumina
          persist-credentials: false

      - uses: ./lumina/.github/actions/linux-build-deps

      - id: web
        uses: ./lumina/.github/actions/filament-web

      - name: Package
        env:
          MODULE_DIR: ${{ steps.web.outputs.module-dir }}
          EMSDK_VERSION: ${{ steps.web.outputs.emsdk-version }}
        run: |
          set -euo pipefail
          name="flutter-filament-web-$TAG"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp "$MODULE_DIR/flutter_filament.js" "$MODULE_DIR/flutter_filament.wasm" "$stage/"
          filament="$(tr -d '[:space:]' < lumina/tool/filament/VERSION)"
          cat > "$stage/README.md" <<EOF
          # flutter_filament web module $TAG

          \`flutter_filament.js\` and \`flutter_filament.wasm\`: Filament's WebGL2 backend and
          flutter_filament's C wrapper as one single-threaded WebAssembly module, built from
          Lumina $TAG against Filament $filament with emsdk $EMSDK_VERSION.

          A Lumina web game serves both files next to its \`index.html\` (Lumina Studio's web
          build stages them from \`flutter_filament/web/\`), or loads them from another URL
          through \`FilamentWeb.ensureInitialized(moduleUrl: ...)\`.
          EOF
          (cd "$RUNNER_TEMP" && zip -q -r "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256" && cat "$name.zip.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: web-module
          path: dist/flutter-filament-web-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  installers:
    name: Installers (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            # VS 2022 (MSVC 14.44): static libraries built with a newer MSVC
            # do not link with an older one, and users run VS 2022 Build Tools.
            runner: windows-2022
            os: windows
            arch: x64
          - platform: linux
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: lumina
          persist-credentials: false

      - name: setup.exe (Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./lumina/installer/windows/build.ps1 -Version $env:VERSION -Tag $env:TAG -OutDir dist -InstallInnoSetup
          # Dry run: lists what the installer would install and download.
          $setup = Get-ChildItem dist -Filter 'lumina-studio-setup-*.exe' | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'setup-dryrun.txt'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/DRYRUN', "/DRYRUNLOG=`"$log`"", '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          Get-Content -Raw $log
          if ($p.ExitCode -ne 0) { throw "setup.exe /DRYRUN exited with $($p.ExitCode)" }

      - name: .deb and .rpm (nfpm)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bash lumina/installer/linux/build.sh "$VERSION" "$TAG" dist "${{ matrix.arch }}"
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # macOS is written but not run: it has never been built or verified.
  # Missing before it can be enabled:
  #   - tool/filament/build_prebuilt.sh on macOS (a universal or arm64
  #     out/cmake-release), a matching fetch_prebuilt.dart asset name, and
  #     that archive in the filament-<VERSION> release (a macOS leg in the
  #     filament matrix and in filament_release.sh's default OS list);
  #   - an OpenRigLogic macOS build (build_openriglogic.sh targets Linux and
  #     its bundled libc++);
  #   - the macOS runner's entitlements (network client, process spawning for
  #     project builds) and lumina_mouse_capture support;
  #   - Developer ID signing and notarization of the .app and the .pkg
  #     (Apple certificates and an App Store Connect key as secrets).
  macos:
    name: macOS (disabled)
    if: false
    needs: check
    runs-on: macos-14
    timeout-minutes: 360
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: lumina
          persist-credentials: false
      - run: brew install ninja cmake
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./lumina/.github/actions/checkout-siblings
      - uses: ./lumina/.github/actions/filament-prebuilt
        with:
          extract: 'true'
      - run: bash tools/flutter_riglogic/tool/build_openriglogic.sh
      - working-directory: lumina
        run: flutter pub get
      - working-directory: lumina/lumina_ui
        run: >-
          flutter build macos --release
          --dart-define=LUMINA_VERSION=${{ env.TAG }}
          --dart-define=LUMINA_COMMIT=${{ env.SHA }}
      - name: Package the app
        run: |
          set -euo pipefail
          mkdir -p dist
          app="$(find lumina/lumina_ui/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          name="lumina-studio-$TAG-macos-arm64.zip"
          ditto -c -k --keepParent "$app" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - name: .pkg
        run: bash lumina/installer/macos/build-pkg.sh "$VERSION" "$TAG" dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          retention-days: 7

  release:
    name: Publish the release
    needs: [check, filament-release, studio, web, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      FILAMENT_TAG: ${{ needs.check.outputs.filament_tag }}
      FILAMENT_VERSION: ${{ needs.check.outputs.filament_version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_SIGNING: ${{ vars.LUMINA_WINDOWS_SIGNING }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      # The editor, OpenRigLogic and the installers; Filament is in its own
      # release.
      - uses: actions/download-artifact@v8
        with:
          pattern: studio-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: web-module
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          for sum in *.sha256; do sha256sum -c "$sum"; done

      # With LUMINA_WINDOWS_SIGNING=local the release stays a draft until
      # tool/release/sign_windows_release.ps1 has replaced the Windows zip and
      # setup with signed ones; it swaps the first line of the notes (the
      # marker below) when it publishes. A re-run over an existing release
      # replaces the Windows assets with unsigned ones again, so it goes back
      # to draft in that mode.
      - name: Create or update the release
        run: |
          set -euo pipefail
          marker='> **Windows assets are being signed.** The Windows zip and setup are replaced with Authenticode-signed builds before this release is published.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            if [ "$WINDOWS_SIGNING" = local ]; then
              body="$(gh release view "$TAG" --json body --jq .body)"
              case "$body" in
                "$marker"*) ;;
                *) body="$(printf '%s\n\n%s' "$marker" "$body")" ;;
              esac
              printf '%s\n' "$body" > "$RUNNER_TEMP/notes.md"
              gh release edit "$TAG" --draft --notes-file "$RUNNER_TEMP/notes.md"
              echo "::notice::Release $TAG is a draft again: sign its Windows assets with tool/release/sign_windows_release.ps1 -Tag $TAG -Publish."
            fi
          else
            flags=(--verify-tag --title "Lumina Studio $TAG")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            changelog="$(dart tool/release/release_info.dart changelog --tag "$TAG" 2>/dev/null || true)"
            notes="$(cat <<'EOF'
          ## Downloads

          | File | What it is |
          |---|---|
          | `lumina-studio-setup-*-windows-x64.exe` | Windows installer: installs Git, the Visual Studio 2022 C++ Build Tools, GStreamer and Flutter, then the latest Lumina Studio |
          | `lumina-studio_*_amd64.deb`, `lumina-studio-*.x86_64.rpm` | Linux x64 packages: build dependencies, Flutter in /opt/lumina/flutter and the latest Lumina Studio in /opt/lumina/studio |
          | `lumina-studio_*_arm64.deb`, `lumina-studio-*.aarch64.rpm` | The same packages for Linux arm64 |
          | `lumina-studio-*-windows-x64.zip`, `lumina-studio-*-linux-x64.tar.gz`, `lumina-studio-*-linux-arm64.tar.gz` | The editor alone (what the installers download) |
          | `lumina-studio-*-windows-x64-store.msix` | The editor as an unsigned Microsoft Store package (for the Partner Center submission; it installs once the Store has signed it) |
          | `lumina-studio-*-windows-x64.msix` | The editor as a signed MSIX package (when signed) |
          | `openriglogic-*` | Prebuilt OpenRigLogic library the editor downloads at first launch |
          | `flutter-filament-web-*.zip` | flutter_filament's WebAssembly module (`flutter_filament.js` + `.wasm`), the files a web game serves next to its `index.html` |

          Every file has a `.sha256` sidecar.
          EOF
          )"
            filament="Filament: the prebuilt Filament \`$FILAMENT_VERSION\` the editor downloads at first launch is in the [$FILAMENT_TAG](https://github.com/$GH_REPO/releases/tag/$FILAMENT_TAG) release."
            notes="$(printf '%s\n\n%s' "$notes" "$filament")"
            if [ -n "$changelog" ]; then
              notes="$(printf '%s\n\n%s' "$changelog" "$notes")"
            fi
            if [ "$WINDOWS_SIGNING" = local ]; then
              flags+=(--draft)
              notes="$(printf '%s\n\n%s' "$marker" "$notes")"
            fi
            gh release create "$TAG" "${flags[@]}" --notes "$notes"
          fi
          gh release upload "$TAG" dist/* --clobber
          {
            echo "### Release $TAG"
            echo
            if [ "$WINDOWS_SIGNING" = local ]; then
              echo "Draft: sign the Windows assets and publish with \`tool/release/sign_windows_release.ps1 -Tag $TAG -Publish\`."
              echo
            fi
            for f in dist/*; do echo "- $(basename "$f")"; done
            echo
            echo "Filament $FILAMENT_VERSION: [$FILAMENT_TAG](https://github.com/$GH_REPO/releases/tag/$FILAMENT_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
