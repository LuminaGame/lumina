# CI for pull requests and pushes to main, on GitHub-hosted runners.
#
#   analyze    `melos run analyze` (flutter analyze in every package)
#   unit       a curated set of fast unit tests on the noop backend (no GPU)
#   web        flutter_filament's WebAssembly module (.github/actions/filament-web)
#              and its browser tests in headless Chrome
#   packaging  release_info.dart checks and the Linux packages
#
# The GPU smoke suites (PNG + video evidence) need a real GPU and the shared
# test assets, which hosted runners do not have; they run on developer
# machines through tool/ci.sh --smoke (or a self-hosted GPU runner calling it).
# The full unit suites run the same way (tool/ci.sh --unit): CI keeps to the
# tests below, which cover the FFI bindings, the data layer, the editor API
# and code generation without rendering.
#
# The unit tests and the web module take long, so they run only when a pull
# request is ready to merge: it carries the `ready-to-merge` label (and is not
# a draft). They can also be started by hand (Actions > ci > Run workflow).
# The web job also runs on pushes to main, which warms its cache (the Filament
# WebAssembly build and the host tools) for the release workflow.
#
# The unit tests compile the native-assets hooks, so they need prebuilt
# Filament: from the cache (key: patches + VERSION + build scripts + OS), else
# the version's own release, filament-<VERSION>
# (tool/filament/fetch_prebuilt.dart), else a build.
# Pushes to main only warm that cache (filament-cache), which release tags
# and pull requests restore.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a pull request's run; runs on main queue instead,
# so the Filament cache job always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with release.yml.
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze:
    name: Analyze
    # Adding a label does not change the code.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: lumina
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./lumina/.github/actions/checkout-siblings

      - name: Resolve the workspace
        working-directory: lumina
        run: flutter pub get

      # melos scripts run `melos exec` in a subshell, so melos must be on
      # PATH; activate the version the workspace lock pins.
      - name: Activate melos
        working-directory: lumina
        run: |
          version=$(awk '/^  melos:/{f=1} f && /version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
          dart pub global activate melos "$version"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      - name: melos run analyze
        working-directory: lumina
        run: melos run analyze

  unit:
    name: Unit tests (noop backend)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'ready-to-merge'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LUMINA_MOUSE_CAPTURE: 'off'
    steps:
      - uses: actions/checkout@v5
        with:
          path: lumina
          persist-credentials: false

      - uses: ./lumina/.github/actions/linux-build-deps

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./lumina/.github/actions/checkout-siblings

      - name: Resolve the workspace
        working-directory: lumina
        run: flutter pub get

      - uses: ./lumina/.github/actions/filament-prebuilt
        with:
          fetch: 'true'
          save: 'false'
          extract: 'true'

      - name: Build OpenRigLogic
        run: bash tools/flutter_riglogic/tool/build_openriglogic.sh

      # Tests never touch a real editor config.
      - name: Isolated config folder
        run: echo "LUMINA_CONFIG_DIR=$RUNNER_TEMP/lumina-config" >> "$GITHUB_ENV"

      - name: flutter_filament
        working-directory: lumina/flutter_filament
        run: >-
          flutter test
          test/math
          test/hook/native_library_cache_test.dart
          test/hook/windows_response_file_test.dart
          test/math_abi_test.dart
          test/enum_fidelity_test.dart
          test/src/engine_test.dart
          test/web/bindings_lockstep_test.dart

      # Pure Dart: `dart test`, which is itself the proof that nothing it
      # reaches needs Flutter.
      - name: lumina_core
        working-directory: lumina/lumina_core
        run: >-
          dart test
          test/architecture/pure_dart_test.dart
          test/formats_round_trip_test.dart
          test/project_manifest_test.dart
          test/tga_decoder_test.dart
          test/asset_test.dart
          test/data/dart_identifiers_test.dart
          test/data/project_settings_model_test.dart

      - name: lumina
        working-directory: lumina/lumina
        run: >-
          flutter test
          test/web/runtime_import_graph_test.dart
          test/architecture/import_cycles_test.dart
          test/architecture/engine_without_editor_data_test.dart

      - name: lumina_editor_data
        working-directory: lumina/lumina_editor_data
        run: >-
          flutter test
          test/architecture/no_widgets_test.dart
          test/architecture/import_cycles_test.dart
          test/obj_parser_test.dart
          test/glb_parser_test.dart
          test/repository_test.dart

      - name: lumina_editor_api
        working-directory: lumina/lumina_editor_api
        run: >-
          flutter test
          test/api_contract_test.dart
          test/editor_level_contract_test.dart
          test/plugin_storage_test.dart
          test/project_settings_section_test.dart

      - name: lumina_ui
        working-directory: lumina/lumina_ui
        run: >-
          flutter test
          test/data/landscape_data_test.dart
          test/data/sequencer_evaluator_test.dart

  web:
    name: Web module (WebAssembly)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'ready-to-merge'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          path: lumina
          persist-credentials: false

      - uses: ./lumina/.github/actions/linux-build-deps

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./lumina/.github/actions/checkout-siblings

      - name: Resolve the workspace
        working-directory: lumina
        run: flutter pub get

      # The native library the tests' hooks link, and the matc the canvas
      # smoke compiles its material with (out/prebuilt-tools-release/tools/matc).
      - uses: ./lumina/.github/actions/filament-prebuilt
        with:
          fetch: 'true'
          save: 'false'
          extract: 'true'

      - id: web
        uses: ./lumina/.github/actions/filament-web

      # Headless Chrome (the runner's google-chrome): the module's exports,
      # heap and ABI parity under node, a WebGL2 canvas drawn through the C
      # functions, the dart:ffi layer and the Dart API compiled by dart2js,
      # and the example app presenting through FilamentWidget.
      - name: Web tests
        working-directory: lumina/flutter_filament
        run: >-
          flutter test
          test/web/module_node_test.dart
          test/web/abi_golden_test.dart
          test/web/canvas_smoke_test.dart
          test/web/browser_suite_test.dart
          test/web/widget_web_smoke_test.dart

      - uses: actions/upload-artifact@v7
        with:
          name: flutter-filament-web
          path: |
            lumina/flutter_filament/web/flutter_filament.js
            lumina/flutter_filament/web/flutter_filament.wasm
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### flutter_filament web module"
            echo
            echo "emsdk ${{ steps.web.outputs.emsdk-version }}; Filament WebAssembly build from cache: ${{ steps.web.outputs.cache-hit }}"
            echo
            ls -la "${{ steps.web.outputs.module-dir }}"/flutter_filament.* | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

  filament-cache:
    name: Filament cache (${{ matrix.platform }}, main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners as release.yml, so tags restore these caches.
          - platform: linux
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          path: lumina
          persist-credentials: false

      - if: startsWith(matrix.platform, 'linux')
        uses: ./lumina/.github/actions/linux-build-deps

      - uses: ./lumina/.github/actions/filament-prebuilt
        with:
          fetch: 'false'
          save: 'true'
          extract: 'false'

  packaging:
    name: Release tooling and Linux packages
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: lumina
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: lumina_ui version is a release version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' lumina/lumina_ui/pubspec.yaml)"
          dart lumina/tool/release/release_info.dart version --tag "v$version"

      - name: Build and inspect the .deb / .rpm
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' lumina/lumina_ui/pubspec.yaml)"
          bash lumina/installer/linux/build.sh "$version" "v$version" dist
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
