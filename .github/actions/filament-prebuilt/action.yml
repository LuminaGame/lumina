name: Prebuilt Filament
description: >
  Makes the prebuilt Filament of this runner's OS available: the archive
  lumina/build/filament-prebuilt/filament-<VERSION>-<os>-<arch>.{zip|tar.gz}
  plus its .sha256 sidecar, from the cache, else built from upstream Filament
  and third_party/filament/patches (tool/filament/build_prebuilt.*). An
  archive already in lumina/build/filament-prebuilt/ (an artifact of the
  same run) is used as is. With `fetch`, a cache miss first tries the
  version's own release, filament-<VERSION>
  (tool/filament/fetch_prebuilt.dart). With `extract` the Filament tree ends
  up where the root pubspec's `filament_dir` user-define points
  (tool/release/release_info.dart filament-dir), which is what the hooks read.

  The cache key hashes the patches, tool/filament/VERSION, the build scripts
  and the runner OS and architecture (Linux x64 and arm64 are separate builds). Caches are scoped to a ref and readable from the default
  branch, so the CI workflow's runs on main keep a cache every release tag
  (and every pull request) can restore.

  Linux runners need the linux-build-deps action first (clang 19+); fetching
  needs the workspace resolved (flutter pub get).

inputs:
  fetch:
    description: On a cache miss, try the filament-<VERSION> release before building.
    default: 'false'
  save:
    description: Save a newly built archive to the cache.
    default: 'true'
  extract:
    description: Unpack the archive to the root pubspec's filament_dir.
    default: 'false'
  android:
    description: >
      Linux only: the Android archive (filament-<VERSION>-android.tar.gz,
      arm64-v8a and x86_64, NDK 28) instead of the desktop one; the desktop
      build runs first for its host tools.
    default: 'false'

outputs:
  version:
    description: tool/filament/VERSION.
    value: ${{ steps.info.outputs.version }}
  os:
    description: linux, windows or macos.
    value: ${{ steps.info.outputs.os }}
  arch:
    description: x64 or arm64.
    value: ${{ steps.info.outputs.arch }}
  cache-hit:
    description: Whether the cache had the archive.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Filament version
      id: info
      shell: bash
      working-directory: lumina
      env:
        ANDROID_ARCHIVE: ${{ inputs.android }}
      run: |
        set -euo pipefail
        if [ ! -f tool/filament/VERSION ]; then
          echo "::error::tool/filament/VERSION is missing." >&2
          exit 1
        fi
        version="$(tr -d '[:space:]' < tool/filament/VERSION)"
        case "$RUNNER_OS" in
          Linux) os=linux; ext=tar.gz ;;
          Windows) os=windows; ext=zip ;;
          macOS) os=macos; ext=tar.gz ;;
          *) echo "::error::Unsupported runner OS $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        {
          echo "version=$version"
          echo "os=$os"
          echo "arch=$arch"
          if [ "$ANDROID_ARCHIVE" = true ]; then
            echo "archive=build/filament-prebuilt/filament-$version-android.tar.gz"
            echo "flavor=android"
          else
            echo "archive=build/filament-prebuilt/filament-$version-$os-$arch.$ext"
            echo "flavor=desktop"
          fi
          # The runner image fixes the toolset the static libraries are built with.
          echo "image=${ImageOS:-unknown}"
        } >> "$GITHUB_OUTPUT"

    - name: Archive already here?
      id: present
      shell: bash
      working-directory: lumina
      env:
        ARCHIVE: ${{ steps.info.outputs.archive }}
      run: |
        if [ -f "$ARCHIVE" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the cache
      id: restore
      if: steps.present.outputs.present != 'true'
      uses: actions/cache/restore@v6
      with:
        path: lumina/build/filament-prebuilt/filament-*
        key: filament-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.info.outputs.flavor }}-${{ steps.info.outputs.image }}-${{ hashFiles('lumina/third_party/filament/patches/**', 'lumina/tool/filament/VERSION', 'lumina/tool/filament/build_prebuilt.sh', 'lumina/tool/filament/build_prebuilt.ps1') }}

    - name: Fetch the published build
      if: steps.present.outputs.present != 'true' && steps.restore.outputs.cache-hit != 'true' && inputs.fetch == 'true'
      shell: bash
      working-directory: lumina
      env:
        VERSION: ${{ steps.info.outputs.version }}
      run: |
        target="$(dart tool/release/release_info.dart filament-dir)"
        if dir="$(dart run tool/filament/fetch_prebuilt.dart)"; then
          mkdir -p "$(dirname "$target")"
          target_abs="$(cd "$(dirname "$target")" && pwd -P)/$(basename "$target")"
          dir_abs="$(cd "$dir" && pwd -P)"
          if [ "$dir_abs" != "$target_abs" ]; then
            rm -rf "$target"
            mv "$dir" "$target"
          fi
          echo "Filament $VERSION from the filament-$VERSION release in $target."
        else
          echo "::notice::No published Filament $VERSION to fetch (release filament-$VERSION); building it."
        fi

    - name: Is a build needed?
      id: need
      shell: bash
      working-directory: lumina
      env:
        ARCHIVE: ${{ steps.info.outputs.archive }}
      run: |
        target="$(dart tool/release/release_info.dart filament-dir 2>/dev/null || echo filament)"
        if [ -f "$ARCHIVE" ] || [ -f "$target/android/gradle.properties" ]; then
          echo "build=false" >> "$GITHUB_OUTPUT"
        else
          echo "build=true" >> "$GITHUB_OUTPUT"
        fi

    # The Android build keeps the runner's Android SDK: NDK 28 is installed
    # into it (the game's ndkVersion; the libc++ must match on both sides).
    - name: Free disk space (Linux)
      if: steps.need.outputs.build == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        ANDROID_ARCHIVE: ${{ inputs.android }}
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        if [ "$ANDROID_ARCHIVE" != true ]; then sudo rm -rf /usr/local/lib/android; fi
        df -h "$GITHUB_WORKSPACE"

    - name: Android NDK 28
      if: steps.need.outputs.build == 'true' && inputs.android == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        ndk="$sdk/ndk/28.2.13676358"
        if [ ! -d "$ndk" ]; then
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' > /dev/null
        fi
        [ -d "$ndk" ] || { echo "::error::NDK 28.2.13676358 is not installed in $sdk." >&2; exit 1; }
        echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"

    # VS 2022 x64 developer environment via vswhere + vcvars64.bat, exported
    # to $GITHUB_ENV (ilammy/msvc-dev-cmd has no Node.js 24 release).
    - name: MSVC environment (Windows)
      if: steps.need.outputs.build == 'true' && runner.os == 'Windows'
      shell: pwsh
      working-directory: lumina
      run: ./.github/scripts/msvc_env.ps1

    - name: Build Filament (Linux / macOS)
      if: steps.need.outputs.build == 'true' && runner.os != 'Windows'
      shell: bash
      working-directory: lumina
      env:
        ANDROID_ARCHIVE: ${{ inputs.android }}
      run: |
        if [ "$ANDROID_ARCHIVE" = true ]; then
          bash tool/filament/build_prebuilt.sh --android
        else
          bash tool/filament/build_prebuilt.sh
        fi

    # A short work folder: MSVC object paths approach MAX_PATH.
    - name: Build Filament (Windows)
      if: steps.need.outputs.build == 'true' && runner.os == 'Windows'
      shell: pwsh
      working-directory: lumina
      run: ./tool/filament/build_prebuilt.ps1 -WorkDir (Join-Path $env:RUNNER_TEMP 'fs')

    - name: Checksums
      if: steps.need.outputs.build == 'true' || steps.restore.outputs.cache-hit == 'true'
      shell: bash
      working-directory: lumina
      env:
        ARCHIVE: ${{ steps.info.outputs.archive }}
      run: |
        set -euo pipefail
        if [ ! -f "$ARCHIVE" ]; then
          echo "::error::No $ARCHIVE after the Filament build." >&2
          ls -la build/filament-prebuilt 2>/dev/null || true
          exit 1
        fi
        cd "$(dirname "$ARCHIVE")"
        name="$(basename "$ARCHIVE")"
        if command -v sha256sum >/dev/null 2>&1; then
          if [ ! -f "$name.sha256" ]; then sha256sum "$name" > "$name.sha256"; fi
          sha256sum -c "$name.sha256"
        else
          if [ ! -f "$name.sha256" ]; then shasum -a 256 "$name" > "$name.sha256"; fi
          shasum -a 256 -c "$name.sha256"
        fi

    - name: Save the cache
      if: steps.need.outputs.build == 'true' && inputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: lumina/build/filament-prebuilt/filament-*
        key: ${{ steps.restore.outputs.cache-primary-key }}

    - name: Unpack to the hooks' filament_dir
      if: inputs.extract == 'true'
      shell: bash
      working-directory: lumina
      env:
        ARCHIVE: ${{ steps.info.outputs.archive }}
      run: bash .github/scripts/extract_filament.sh "$ARCHIVE" "$(dart tool/release/release_info.dart filament-dir)"
