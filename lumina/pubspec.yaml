name: lumina
description: "Declarative 3D Game Engine built on top of flutter_filament."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_filament:
    path: ../flutter_filament
  # From the tools repo; pubspec_overrides.yaml at the workspace root points
  # them at a local ../tools checkout.
  flutter_assimp:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: flutter_assimp
      ref: 1547d59790d2308fa88a32c963be6f50f1b33813
  flutter_riglogic:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: flutter_riglogic
      ref: 1547d59790d2308fa88a32c963be6f50f1b33813
  # The smoke-test system that lib/testing.dart exports (SmokeArtifacts, the
  # video rules and recorders, the report runner of tool/smoke_report.dart).
  lumina_smoke:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: lumina_smoke
      ref: 1547d59790d2308fa88a32c963be6f50f1b33813
  # Pointer capture for games and Play (tools repo).
  lumina_mouse_capture:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: lumina_mouse_capture
      ref: 1547d59790d2308fa88a32c963be6f50f1b33813
  vector_math: ^2.1.4

  meta: any
  ffi: any
  image: ^4.9.2
  pub_semver: ^2.2.0
  path: ^1.9.1
  # Content hashes of derived-data keys, and reading a
  # project pubspec's asset list for the Cook & Package guard.
  crypto: ^3.0.7
  yaml: ^3.1.3
  # The editor-side scanner that reads @BlueprintCallable /
  # @BlueprintPure functions (lib/data only; games never import it).
  analyzer: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  puppeteer: ^3.26.0
  test: ^1.31.1
  # Reads back the zips tool/pack_plugin.dart writes (plugin_pack_script_test).
  archive: ^4.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    # Shipped with LuminaProceduralSkyComponent (the Procedural Sky & Ocean).
    - assets/sky/simulated_skybox.filamat
    - assets/sky/moon_disk.png
    - assets/sky/moon_normal.png
    - assets/sky/milkyway.png

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
