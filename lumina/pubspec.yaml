name: lumina
description: "The Lumina game engine: a declarative 3D world, its objects, physics, animation, Blueprint VM and rendering through flutter_filament. No Flutter widgets: the game UI is lumina_widgets."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Its Dart API only (`package:flutter_filament/filament.dart`): the view
  # widget is hosted by lumina_widgets.
  flutter_filament:
    path: ../flutter_filament
  # The pure-Dart foundation (math, file formats, paths, logger) the engine,
  # the editor and plugin processes share.
  lumina_core:
    path: ../lumina_core
  # From the tools repo; pubspec_overrides.yaml at the workspace root points
  # them at a local ../tools checkout. (Assimp and RigLogic are editor
  # tooling: lumina_editor_data depends on them, the engine does not.)
  # The smoke-test system that lib/testing.dart exports (SmokeArtifacts, the
  # video rules and recorders, the report runner of tool/smoke_report.dart).
  lumina_smoke:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: lumina_smoke
      ref: 227b3cd34ef0d41ff114b909545efb47f3e2a225
  vector_math: ^2.1.4

  meta: any
  ffi: any
  image: ^4.9.2
  path: ^1.9.1
dev_dependencies:
  pub_semver: ^2.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  # Reads the import graph in the architecture tests.
  analyzer: ^13.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    # Shipped with LuminaProceduralSkyComponent (the Procedural Sky & Ocean).
    - assets/sky/simulated_skybox.filamat
    - assets/sky/moon_disk.png
    - assets/sky/moon_normal.png
    - assets/sky/milkyway.png

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
