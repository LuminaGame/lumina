name: lumina_plugin_process
description: "The part of a Lumina Studio plugin that runs in its own process, in pure Dart: the process-side API (LuminaPluginProcess, PluginProcessContext), its runtime (runPluginProcessMain, the request dispatch, the level proxy), the editor data types it uses (level snapshots, plugin storage, MCP tool types) and a loopback test host. No Flutter, dart:ui or FFI."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
resolution: workspace

# Pure packages only (test/architecture/pure_dart_test.dart walks the whole
# import graph).
dependencies:
  lumina_core:
    path: ../lumina_core
  lumina_plugin_protocol:
    path: ../lumina_plugin_protocol
  meta: ^1.15.0
  path: ^1.9.1

dev_dependencies:
  # Parses directives for the pure-Dart guard (pure Dart itself).
  analyzer: ^13.3.0
  lints: ^6.0.0
  test: ^1.31.1
